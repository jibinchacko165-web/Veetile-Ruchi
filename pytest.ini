[pytest]
DJANGO_SETTINGS_MODULE = veetile_ruchi_project.settings
testpaths = tests/selenium
python_files = test_home.py test_auth.py test_customer.py test_chef.py test_courier.py test_admin.py test_access_control.py
addopts = -s -v --reuse-db
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::django.utils.deprecation.RemovedInDjango51Warning
