<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Main heart gradient: deep red to warm coral -->
    <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="50%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#F8B4C6"/>
    </linearGradient>
    <!-- Golden shine highlight -->
    <linearGradient id="shineGrad" x1="0.2" y1="0" x2="0.5" y2="0.6">
      <stop offset="0%" stop-color="#F4C542" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F4C542" stop-opacity="0"/>
    </linearGradient>
    <!-- Glossy top highlight -->
    <radialGradient id="glossGrad" cx="0.35" cy="0.3" r="0.45">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft drop shadow -->
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#E63946" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Shadow layer heart -->
  <path d="M32 56 C32 56 6 40 6 22 C6 12 14 6 22 6 C26.5 6 30.5 8.5 32 12 C33.5 8.5 37.5 6 42 6 C50 6 58 12 58 22 C58 40 32 56 32 56Z"
        filter="url(#shadow)"
        fill="url(#heartGrad)"/>

  <!-- Golden accent shine -->
  <path d="M32 56 C32 56 6 40 6 22 C6 12 14 6 22 6 C26.5 6 30.5 8.5 32 12 C33.5 8.5 37.5 6 42 6 C50 6 58 12 58 22 C58 40 32 56 32 56Z"
        fill="url(#shineGrad)"/>

  <!-- Glossy glass highlight on upper-left lobe -->
  <ellipse cx="21" cy="18" rx="9" ry="7" fill="url(#glossGrad)" transform="rotate(-15 21 18)"/>

  <!-- Tiny sparkle dot for premium feel -->
  <circle cx="18" cy="15" r="1.8" fill="#ffffff" opacity="0.85"/>
</svg>
