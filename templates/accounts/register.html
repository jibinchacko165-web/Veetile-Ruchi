{% extends 'base.html' %}

{% block title %}Create Account — Veetile-Ruchi{% endblock %}

{% block extra_head %}
<script>
    function toggleRoleFields() {
        const role = document.getElementById('role') ? document.getElementById('role').value : 'customer';
        const chefFields = document.getElementById('chef-fields');
        const deliveryFields = document.getElementById('delivery-fields');
        
        if (chefFields) {
            chefFields.style.display = (role === 'chef') ? 'block' : 'none';
        }
        if (deliveryFields) {
            deliveryFields.style.display = (role === 'delivery_boy') ? 'block' : 'none';
        }
    }

    function togglePassword(inputId, btnId) {
        const field = document.getElementById(inputId);
        const btn = document.getElementById(btnId);
        if (!field || !btn) return;
        if (field.type === 'password') {
            field.type = 'text';
            btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            btn.title = 'Hide Password';
        } else {
            field.type = 'password';
            btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            btn.title = 'Show Password';
        }
    }

    function checkPasswordMatch() {
        const p1 = document.getElementById('password') ? document.getElementById('password').value : '';
        const p2 = document.getElementById('confirm_password') ? document.getElementById('confirm_password').value : '';
        const status = document.getElementById('password-match-status');
        
        if (!status) return;
        if (!p2) {
            status.innerHTML = '';
            return;
        }
        
        if (p1 === p2) {
            status.style.color = '#15803D';
            status.innerHTML = '🟢 Passwords match!';
        } else {
            status.style.color = '#B91C1C';
            status.innerHTML = '🔴 Passwords do not match!';
        }
    }

    window.onload = function() {
        toggleRoleFields();
    };
</script>
{% endblock %}

{% block content %}
<div style="max-width: 540px; margin: 2.5rem auto;" class="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: var(--accent-green-bg); color: var(--primary-green); display: inline-flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 0.75rem; border: 2px solid var(--border-leaf);">
            <span>🍲</span>
        </div>
        <h1 style="font-size: 2rem; font-weight: 700; color: var(--primary-green); margin: 0;">Create Account</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem; font-weight: 400;">Join Veetile-Ruchi Authentic Kerala Food Platform</p>
    </div>

    <form method="POST" action="{% url 'register' %}">
        {% csrf_token %}
        
        <div class="form-group mb-3">
            <label class="form-label" for="username">Username <span style="color: var(--danger);">*</span></label>
            <input type="text" name="username" id="username" class="form-control" placeholder="Choose a username (e.g. rahul)" value="{{ form_data.username|default:'' }}" required autofocus style="font-size: 0.98rem;">
        </div>
        
        <div class="form-group mb-3">
            <label class="form-label" for="email">Email Address <span style="color: var(--danger);">*</span></label>
            <input type="email" name="email" id="email" class="form-control" placeholder="user@gmail.com" value="{{ form_data.email|default:'' }}" required style="font-size: 0.98rem;">
        </div>

        <div class="form-group mb-3">
            <label class="form-label" for="phone">Mobile Phone Number <span style="color: var(--danger);">*</span></label>
            <input type="text" name="phone" id="phone" class="form-control" placeholder="10-digit mobile number (e.g. 9876543210)" value="{{ form_data.phone|default:'' }}" required style="font-size: 0.98rem;">
        </div>
        
        <div class="form-group mb-3">
            <label class="form-label" for="dob">Date of Birth (DOB) <span style="color: var(--danger);">*</span></label>
            <input type="date" name="dob" id="dob" class="form-control" min="1900-01-01" max="2026-12-31" value="{{ form_data.dob|default:'' }}" required style="font-size: 0.98rem;">
        </div>
        
        <div class="form-group mb-3">
            <label class="form-label" for="password">Create Strong Password <span style="color: var(--danger);">*</span></label>
            <div style="position: relative;">
                <input type="password" name="password" id="password" class="form-control" placeholder="Min 8 chars, uppercase, lowercase, digit, symbol" oninput="checkPasswordMatch()" required style="padding-right: 3rem; font-size: 0.98rem;" autocomplete="new-password">
                <button type="button" id="toggle-pwd-btn" onclick="togglePassword('password', 'toggle-pwd-btn')" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--text-muted); padding: 6px;" title="Show Password"><i class="fa-solid fa-eye"></i></button>
            </div>
        </div>

        <div class="form-group mb-4">
            <label class="form-label" for="confirm_password">Confirm Password <span style="color: var(--danger);">*</span></label>
            <div style="position: relative;">
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Re-enter password to confirm" oninput="checkPasswordMatch()" required style="padding-right: 3rem; font-size: 0.98rem;" autocomplete="new-password">
                <button type="button" id="toggle-confirm-btn" onclick="togglePassword('confirm_password', 'toggle-confirm-btn')" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--text-muted); padding: 6px;" title="Show Password"><i class="fa-solid fa-eye"></i></button>
            </div>
            <p id="password-match-status" style="font-size: 0.85rem; margin-top: 0.35rem; font-weight: 500;"></p>
        </div>

        <!-- Role defaults to customer -->
        <input type="hidden" name="role" id="role" value="customer">

        <!-- Dynamic Chef Fields (if chef role used) -->
        <div id="chef-fields" class="form-group mb-3" style="display: none;">
            <label class="form-label" for="specialty">Chef Culinary Specialty</label>
            <input type="text" name="specialty" id="specialty" class="form-control" placeholder="e.g. Traditional Kerala Sadya, Seafood" value="{{ form_data.specialty|default:'' }}">
        </div>

        <!-- Dynamic Delivery Boy Fields -->
        <div id="delivery-fields" class="form-group mb-3" style="display: none;">
            <label class="form-label" for="vehicle_number">Vehicle Number</label>
            <input type="text" name="vehicle_number" id="vehicle_number" class="form-control" placeholder="e.g. KL-07-CD-5678" value="{{ form_data.vehicle_number|default:'' }}">
        </div>

        <button type="submit" class="btn" style="width: 100%; padding: 0.85rem; font-size: 1.1rem; border-radius: 10px; margin-top: 0.5rem;">
            Register Account
        </button>
    </form>
    
    <div style="text-align: center; margin-top: 1.5rem; border-top: 1.5px solid var(--border-warm); padding-top: 1.25rem;">
        <p style="color: var(--text-muted); font-size: 0.92rem; margin: 0; font-weight: 400;">
            Already have an account? <a href="{% url 'login' %}" style="color: var(--primary-green); text-decoration: none; font-weight: 600;">Sign In Here</a>
        </p>
    </div>
</div>
{% endblock %}
