{% extends 'base.html' %}

{% block extra_head %}
<script>
    function toggleLoginPassword() {
        const field = document.getElementById('password');
        const btn = document.getElementById('login-pwd-btn');
        if (!field || !btn) return;
        
        if (field.type === 'password') {
            field.type = 'text';
            btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            btn.setAttribute('title', 'Hide Password');
        } else {
            field.type = 'password';
            btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            btn.setAttribute('title', 'Show Password');
        }
    }
    document.addEventListener('DOMContentLoaded', function() {
        const u = document.getElementById('username');
        const p = document.getElementById('password');
        if (u && u.value.trim() !== '') {
            if (p) p.focus();
        } else if (u) {
            u.focus();
        }
    });
</script>
{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 3.5rem auto;" class="card">
    <h2 class="text-center mb-1" style="font-size: 2.2rem; color: var(--text-light);">Sign In</h2>
    <p class="text-center mb-3" style="color: var(--text-muted);">Access your Veetile Ruchi account</p>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group mb-3">
            <label class="form-label" for="username">Username or Email</label>
            <input type="text" name="username" id="username" class="form-control" placeholder="Enter username or email" value="{{ prefilled_username|default:'' }}" required>
        </div>
        <div class="form-group mb-3">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
                <a href="{% url 'password_reset' %}" id="forgot-password-link" style="color: var(--primary); text-decoration: none; font-size: 0.88rem; font-weight: 600; transition: var(--transition);">Forgot password?</a>
            </div>
            <div style="position: relative;">
                <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required style="padding-right: 2.8rem;">
                <button type="button" id="login-pwd-btn" onclick="toggleLoginPassword()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.05rem; color: var(--text-muted); display: flex; align-items: center; justify-content: center; padding: 4px;" title="Show Password">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="btn" style="width: 100%; padding: 0.8rem; font-size: 1.1rem; border-radius: 8px; font-weight: 600;">
            Sign In
        </button>
    </form>
    
    <p class="text-center mt-3" style="color: var(--text-muted); font-size: 0.95rem;">
        New to Veetile Ruchi? <a href="{% url 'register' %}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create an account</a>
    </p>
</div>
{% endblock %}
