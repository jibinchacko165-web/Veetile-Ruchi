{% extends 'base.html' %}

{% block title %}Sign In — Veetile-Ruchi{% endblock %}

{% block extra_head %}
<script>
    function toggleLoginPassword() {
        const field = document.getElementById('password');
        const btn = document.getElementById('login-pwd-btn');
        if (!field || !btn) return;
        
        if (field.type === 'password') {
            field.type = 'text';
            btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            btn.setAttribute('title', 'Hide Password');
        } else {
            field.type = 'password';
            btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            btn.setAttribute('title', 'Show Password');
        }
    }
    document.addEventListener('DOMContentLoaded', function() {
        const u = document.getElementById('username');
        const p = document.getElementById('password');
        if (u && u.value.trim() !== '') {
            if (p) p.focus();
        } else if (u) {
            u.focus();
        }
    });
</script>
{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;" class="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: var(--accent-green-bg); color: var(--primary-green); display: inline-flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 0.75rem; border: 2px solid var(--border-leaf);">
            <span>🍲</span>
        </div>
        <h1 style="font-size: 2rem; font-weight: 700; color: var(--primary-green); margin: 0;">Sign In</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem; font-weight: 400;">Access your authentic Kerala food account</p>
    </div>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group mb-3">
            <label class="form-label" for="username">Username or Email Address</label>
            <input type="text" name="username" id="username" class="form-control" placeholder="e.g. rahul / user@gmail.com" value="{{ prefilled_username|default:'' }}" required style="font-size: 0.98rem;">
        </div>
        
        <div class="form-group mb-3">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
                <a href="{% url 'password_reset' %}" id="forgot-password-link" style="color: var(--primary-green); text-decoration: none; font-size: 0.88rem; font-weight: 600;">Forgot password?</a>
            </div>
            <div style="position: relative;">
                <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required style="padding-right: 3rem; font-size: 0.98rem;">
                <button type="button" id="login-pwd-btn" onclick="toggleLoginPassword()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--text-muted); padding: 4px;" title="Show Password">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn" style="width: 100%; padding: 0.8rem; font-size: 1.05rem; font-weight: 600; border-radius: 10px; margin-top: 0.5rem;">
            Sign In
        </button>
    </form>
    
    <div style="text-align: center; border-top: 1.5px solid var(--border-warm); margin-top: 1.5rem; padding-top: 1.25rem;">
        <p style="color: var(--text-muted); font-size: 0.92rem; margin: 0; font-weight: 400;">
            New to Veetile-Ruchi? <a href="{% url 'register' %}" style="color: var(--primary-orange); text-decoration: none; font-weight: 600;">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
